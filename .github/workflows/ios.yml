name: Build iPhone app

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Intel macOS: GitHub's Apple-silicon (arm64) pool is often full and jobs time out waiting
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Build the web app
        run: node scripts/build-www.js

      - name: Get Python for iOS and yt-dlp
        run: bash scripts/fetch-python.sh

      - name: Create the iOS project
        run: |
          pod --version
          npx cap add ios
          bash scripts/patch-ios.sh
          ruby scripts/add-native.rb ios/App
          npx cap sync ios

      - name: Simulator self-test (Python + yt-dlp + merging)
        continue-on-error: true
        timeout-minutes: 25
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build > sim.log 2>&1 || { grep -E "error:|fatal error" sim.log | head -60; tail -60 sim.log; exit 1; }
          APP=simbuild/Build/Products/Release-iphonesimulator/App.app
          du -sh "$APP"; ls "$APP" | head -40; ls "$APP/Frameworks" | head -20; ls "$APP/Frameworks" | wc -l
          DEV=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          echo "Simulator $DEV"
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          SIMCTL_CHILD_AURORA_SELFTEST=1 xcrun simctl launch "$DEV" com.undeadbossgames.aurora
          F=""
          for i in $(seq 1 100); do
            C=$(xcrun simctl get_app_container "$DEV" com.undeadbossgames.aurora data 2>/dev/null || true)
            F="$C/Documents/selftest.json"
            if [ -f "$F" ] && grep -q '"finished"' "$F"; then break; fi
            sleep 6
          done
          echo "===== SELFTEST ====="; cat "$F" || echo "no selftest file"
          echo "===== Downloads ====="; ls -la "$C/Documents/Music/Downloads" 2>/dev/null || true
          echo "===== app log ====="; xcrun simctl spawn "$DEV" log show --last 15m --style compact --predicate 'process == "App"' 2>/dev/null | grep -v -E "CoreFoundation|UIKit|RunningBoard|com.apple.network" | tail -150 || true
          grep -q '"finished"' "$F" && ! grep -q '"startError"' "$F"

      - name: Build Aurora.app for iPhone (unsigned)
        run: |
          VER=$(node -p "require('./package.json').version")
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { grep -E "error:|fatal error" build.log | head -60; tail -80 build.log; exit 1; }
          grep -E "Install Python|Installing binary" build.log | head -5 || true
          tail -5 build.log
          test -d build/Build/Products/Release-iphoneos/App.app
          du -sh build/Build/Products/Release-iphoneos/App.app

      - name: Package Aurora.ipa
        run: |
          VER=$(node -p "require('./package.json').version")
          mkdir -p dist/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app dist/Payload/Aurora.app
          cd dist && zip -qry "Aurora-iOS-$VER.ipa" Payload && rm -rf Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: Aurora-iOS
          path: dist/*.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipa
          generate_release_notes: true
